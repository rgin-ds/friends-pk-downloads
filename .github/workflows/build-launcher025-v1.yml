name: Build Windows launcher 0.2.5
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: launcher-v0.2.5
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify private context, build, and retain binary draft only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = rgin-ds/friends-pk-downloads
          test "$GITHUB_REPOSITORY_ID" = 1433690543
          test "$GITHUB_RUN_ATTEMPT" = 1
          cd "$RUNNER_TEMP"
          api=repos/rgin-ds/friends-pk-downloads
          check_context() {
            gh api "$api/releases/424421390" > context-release.json
            jq -e '.id == 424421390 and .tag_name == "private-build-context-launcher-v0.2.5-20261026" and .draft == true and (.assets | length) == 1 and .assets[0].id == 678573406 and .assets[0].size == 220885 and .assets[0].state == "uploaded" and .assets[0].digest == "sha256:f921580ceff83a33935b3ab4da139106813e67a5313b1b78a0252316ed7d33ae"' context-release.json > /dev/null
          }
          require_absent() {
            if gh api "$api/releases/tags/launcher-v0.2.5" > tag.json 2> tag-error.txt; then echo '025 tag already exists; refusing adoption'; exit 1; fi
            grep -q 'HTTP 404' tag-error.txt
          }
          check_context
          require_absent
          python3 - <<'PY_CONTEXT'
          import os,urllib.request,urllib.error,urllib.parse,pathlib,subprocess,hashlib
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):return None
          req=urllib.request.Request('https://api.github.com/repos/rgin-ds/friends-pk-downloads/releases/assets/678573406',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/octet-stream','X-GitHub-Api-Version':'2022-11-28'})
          try:
              response=urllib.request.build_opener(NoRedirect).open(req,timeout=30)
              data=response.read(220886);assert len(data)==220885;pathlib.Path('context.tar.gz').write_bytes(data)
          except urllib.error.HTTPError as e:
              assert e.code==302
              url=e.headers['Location'];p=urllib.parse.urlsplit(url)
              assert p.scheme=='https' and p.hostname in ('release-assets.githubusercontent.com','objects.githubusercontent.com') and not p.username and not p.password and p.port in (None,443)
              env={k:v for k,v in os.environ.items() if not any(x in k.upper() for x in ('TOKEN','SECRET','PASSWORD','AUTHORIZATION'))}
              try:
                  result=subprocess.run(['curl','--fail','--silent','--show-error','--location','--proto','=https','--proto-redir','=https','--retry','0','--connect-timeout','15','--max-time','60','--max-filesize','220885','--output','context.tar.gz',url],env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=65)
              except subprocess.TimeoutExpired:
                  raise RuntimeError('Private context download timed out') from None
              if result.returncode:raise RuntimeError('Private context download failed') from None
          p=pathlib.Path('context.tar.gz');assert p.stat().st_size==220885 and hashlib.sha256(p.read_bytes()).hexdigest()=='f921580ceff83a33935b3ab4da139106813e67a5313b1b78a0252316ed7d33ae'
          PY_CONTEXT
          printf '%s' '' | base64 --decode > build-worker.py
          printf '%s  %s\n' 'cf001f6827745c064d4e6b709c04f846e74990a2ebf5638d94b5c5319135b25e' build-worker.py | sha256sum --check --status
          env -u GH_TOKEN -u GITHUB_TOKEN python3 build-worker.py context.tar.gz "$RUNNER_TEMP/build025"
          check_context
          require_absent
          dist="$RUNNER_TEMP/build025/desktop-client/out/distribution"
          name=RSPS-Playtest-0.2.5-windows-x64.zip
          size=$(jq -r '.downloads["win32-x64"].bytes' "$dist/latest.json")
          sha=$(jq -r '.downloads["win32-x64"].sha256' "$dist/latest.json")
          gh api --method POST "$api/releases" -f tag_name=launcher-v0.2.5 -f name='Windows launcher 0.2.5' -F draft=true -F prerelease=false -f body="Private candidate: launcher0.2.5 retains verified native-download progress for manual resume and final whole-file SHA validation. No underlying network speed fix is claimed. ZIP SHA-256 $sha; $size bytes. Do not publish without separate owner approval." > binary-release.json
          id=$(jq -r '.id' binary-release.json)
          test "$id" != 424421390
          test "$id" != 423718822
          test "$id" != 423726827
          jq -e '.tag_name == "launcher-v0.2.5" and .draft == true and (.assets | length) == 0' binary-release.json > /dev/null
          gh api --method POST "https://uploads.github.com/repos/rgin-ds/friends-pk-downloads/releases/$id/assets?name=$name" -H 'Content-Type: application/zip' --input "$dist/$name" > binary-asset.json
          asset=$(jq -r '.id' binary-asset.json)
          gh api "$api/releases/assets/$asset" > verified.json
          jq -e --arg name "$name" --arg digest "sha256:$sha" --argjson size "$size" '.name == $name and .size == $size and .state == "uploaded" and .digest == $digest' verified.json > /dev/null
          gh api "$api/releases/$id" > before-publish.json
          jq -e --argjson asset "$asset" '.tag_name == "launcher-v0.2.5" and .draft == true and (.assets | length) == 1 and .assets[0].id == $asset' before-publish.json > /dev/null
          check_context
          check_context
          jq -n --arg sha "$sha" --argjson size "$size" --argjson release "$id" --argjson asset "$asset" '{status:"PASS_BUILT025_VERIFIED_BINARY_DRAFT_ONLY",sha256:$sha,bytes:$size,releaseId:$release,assetId:$asset,contextStillDraft:true,binaryStillDraft:true,published:false,windowsExecuted:false}'
