name: Fetch verified Windows launcher 0.2.3
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: launcher-v0.2.3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify fixed artifact and publish exact release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo=rgin-ds/friends-pk-downloads
          tag=launcher-v0.2.3
          id=423710836
          name=RSPS-Playtest-0.2.3-windows-x64.zip
          sha=0557035ef6901175718ac16e402ba5d02f565a57c3b29da3b04524faeadb7133
          size=201782302
          test "$GITHUB_REPOSITORY" = "$repo"
          test "$GITHUB_REPOSITORY_ID" = 1433690543
          test "$GITHUB_RUN_ATTEMPT" = 1
          cd "$RUNNER_TEMP"
          env -u GH_TOKEN -u GITHUB_TOKEN curl --fail --silent --show-error --proto '=https' --tlsv1.2 --retry 0 --connect-timeout 15 --max-time 300 --max-filesize 201782302 --speed-limit 16384 --speed-time 20 --output "$name" "https://169.58.124.16/friends/api/downloads/$name"
          test "$(wc -c < "$name" | tr -d ' ')" = "$size"
          printf '%s  %s\n' "$sha" "$name" | sha256sum --check --status
          api="repos/$repo"
          gh api "$api/releases/$id" > release.json
          jq -e --arg tag "$tag" '.id == 423710836 and .tag_name == $tag and .draft == true and (.prerelease | not) and (.assets | length) == 0' release.json > /dev/null
          gh api --method POST "https://uploads.github.com/repos/$repo/releases/$id/assets?name=$name" -H 'Content-Type: application/zip' --input "$name" > asset.json
          asset=$(jq -r '.id' asset.json)
          gh api "$api/releases/assets/$asset" > verified.json
          jq -e --arg name "$name" --arg digest "sha256:$sha" --argjson size "$size" '.name == $name and .size == $size and .state == "uploaded" and .digest == $digest' verified.json > /dev/null
          gh api "$api/releases/$id" > release.json
          jq -e --arg tag "$tag" --argjson asset "$asset" '.id == 423710836 and .tag_name == $tag and .draft == true and (.assets | length) == 1 and .assets[0].id == $asset' release.json > /dev/null
          gh api --method PATCH "$api/releases/$id" -F draft=false -f make_latest=false > published.json
          jq -e --arg tag "$tag" '.tag_name == $tag and .draft == false' published.json > /dev/null
          printf 'Published exact %s/%s: %s bytes, SHA-256 %s\n' "$repo" "$tag" "$size" "$sha"
